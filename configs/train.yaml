experiment:
  seed: 42
  iterations: 200
  checkpoint_dir: checkpoints/gomoku_9x9

game:
  board_size: 9
  connect: 5

network:
  input_channels: 3
  channels: 64
  residual_blocks: 5
  value_hidden_channels: 32
  value_hidden_size: 128

mcts:
  num_simulations: 200
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

self_play:
  games_per_iteration: 32
  temperature_moves: 15
  sampling_temperature: 1.0
  add_root_noise: true
  augment_symmetries: true

training:
  replay_capacity: 500000
  batch_size: 256
  steps_per_iteration: 200
  learning_rate: 0.001
  weight_decay: 0.0001
  value_loss_weight: 1.0
  max_grad_norm: 5.0
  use_amp: true

arena:
  games: 20
  num_simulations: 200
  c_puct: 1.5
  promotion_threshold: 0.55
