experiment:
  name: smoke
  seed: 42
  iterations: 1
  checkpoint_dir: checkpoints/smoke
  log_dir: logs/smoke

game:
  board_size: 5
  connect: 4

network:
  input_channels: 3
  channels: 16
  residual_blocks: 1
  value_hidden_channels: 8
  value_hidden_size: 16

mcts:
  num_simulations: 4
  c_puct: 1.5
  dirichlet_alpha: 0.3
  dirichlet_epsilon: 0.25

self_play:
  games_per_iteration: 2
  temperature_moves: 4
  sampling_temperature: 1.0
  add_root_noise: true
  augment_symmetries: true

training:
  batch_size: 8
  replay_capacity: 1000
  steps_per_iteration: 2
  learning_rate: 0.001
  weight_decay: 0.0001
  value_loss_weight: 1.0
  max_grad_norm: 5.0
  use_amp: true

arena:
  games: 2
  num_simulations: 4
  promotion_threshold: 0.55
